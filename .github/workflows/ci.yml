name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source lints
        run: |
          bash tools/check_ss_prefix.sh
          bash tools/check_i18n.sh
          bash tools/check_file_macro.sh
          bash tools/check_comments.sh
          bash tools/check_private_paths.sh
          python3 tools/check_font_coverage.py

      - name: Generated files are current
        run: |
          python3 tools/codegen/generate_headers.py
          python3 tools/codegen/generate_kernel_instantiation.py
          python3 tools/codegen/generate_backend_api.py
          git diff --exit-code || {
            echo "::error::src/generated, src/instantiations or src/backend/api is behind tools/codegen"
            exit 1
          }

      - name: Comment budget
        if: github.event_name == 'pull_request'
        run: |
          git reset --soft ${{ github.event.pull_request.base.sha }}
          python3 tools/check_comment_length.py

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev libgl1-mesa-dev xorg-dev
          sudo apt install -y libwayland-dev libwayland-bin wayland-protocols libxkbcommon0 libxkbcommon-x11-0 libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev spirv-tools

      - uses: actions/cache@v4
        with:
          path: |
            build_vulkan/slang-*
            build_vulkan/Vulkan-Headers-*
          key: fetched-linux-${{ hashFiles('cmake/SsSlang.cmake', 'cmake/SsVulkan.cmake') }}

      - name: Build
        run: bash build_develop.bash -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON

      - name: Smoke
        run: ./build_vulkan/spirula train --help

      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION=${REF_NAME#v} ;;
            *) VERSION=$(git rev-parse --short=7 HEAD) ;;
          esac
          ASSET=spirula-$VERSION-ubuntu-vulkan-x86_64.zip
          zip -j "$ASSET" build_vulkan/spirula
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install cmake ninja libomp

      - uses: actions/cache@v4
        with:
          path: |
            build/slang-*
            build/MoltenVK-*
          key: fetched-macos-${{ hashFiles('cmake/SsSlang.cmake', 'cmake/SsVulkan.cmake') }}

      - name: Build
        shell: bash
        run: |
          bash build_develop.bash -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON 2>&1 | tee configure.log

      - name: OpenMP was found
        run: grep -q "Found OpenMP" configure.log

      - name: Smoke
        run: ./build/spirula train --help

      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cmake --build build --target macos_dmg
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION=${REF_NAME#v} ;;
            *) VERSION=$(git rev-parse --short=7 HEAD) ;;
          esac
          ASSET=spirula-$VERSION-macos-vulkan-arm64.dmg
          mv "build/Spirula Studio.dmg" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe
          $p = Start-Process -FilePath .\vulkan_sdk.exe -NoNewWindow -Wait -PassThru `
               -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build_develop.bat -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON

      - name: Smoke
        shell: cmd
        run: build_vulkan\spirula.exe train --help

      - name: Package
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:REF_NAME.Substring(1) } else { git rev-parse --short=7 HEAD }
          $asset = "spirula-$version-windows-vulkan-x86_64.zip"
          Compress-Archive -Path build_vulkan\spirula.exe -DestinationPath $asset
          "ASSET=$asset" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  # Runs after a partial failure too, so "Re-run failed jobs" finishes the set.
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: spirula-*
          path: assets
          merge-multiple: true
          skip-decompress: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" assets/* --clobber
